name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows export
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Godot build
        uses: ./.github/actions/godot-build

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/* -DestinationPath Rempart-windows.zip -Force
          Get-Item Rempart-windows.zip | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rempart-windows-${{ github.sha }}
          path: Rempart-windows.zip
          if-no-files-found: error
          retention-days: 14
