body{margin:0}
.e-mono{font-family:'Share Tech Mono',monospace}

.e-nv{text-shadow:2px 2px 0 #071233,-1px -1px 0 #071233,1px -1px 0 #071233,-1px 1px 0 #071233}
.e-tab{width:300px;height:54px;padding:2px;border:0;background:#9FC0EA;transform:skewY(3deg);clip-path:polygon(0 0,100% 0,100% 64%,calc(100% - 16px) 100%,0 100%);cursor:pointer}
.e-tab-in{display:flex;align-items:center;height:100%;padding:0 18px;background:linear-gradient(180deg,#2C56A6 0%,#17346F 50%,#0D2050 100%);clip-path:polygon(0 0,100% 0,100% 64%,calc(100% - 15px) 100%,0 100%);font-family:'Saira Condensed',sans-serif;font-size:26px;font-weight:700;color:#FFFFFF;text-shadow:2px 2px 0 #071233,-1px -1px 0 #071233,1px -1px 0 #071233,-1px 1px 0 #071233}
.e-key{font-family:'Share Tech Mono',monospace;font-size:19px;color:#FFFFFF;background:transparent;border:0;padding:0 4px;height:44px;cursor:pointer;text-shadow:1px 1px 0 #031208,-1px -1px 0 #031208}
.bg-root{background:radial-gradient(ellipse 900px 640px at 760px 380px,#158050 0%,#0C4A2C 55%,#052012 100%)}
.bg-grid{position:absolute;inset:-56px;background:linear-gradient(rgba(110,255,160,0.10) 1px,rgba(0,0,0,0) 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(110,255,160,0.10) 1px,rgba(0,0,0,0) 1px) 0 0/28px 28px;animation:bgGrid 6s linear infinite}
@keyframes bgGrid{to{transform:translate(28px,28px)}}
.bg-spin{transform-box:fill-box;transform-origin:center;animation:bgSpin 60s linear infinite}
.bg-spin-r{transform-box:fill-box;transform-origin:center;animation:bgSpin 38s linear infinite reverse}
@keyframes bgSpin{to{transform:rotate(360deg)}}
.bg-sweep{position:absolute;left:580px;top:60px;width:600px;height:600px;border-radius:50%;background:conic-gradient(from 0deg,rgba(63,224,200,0) 0deg,rgba(63,224,200,0) 300deg,rgba(63,224,200,0.22) 360deg);animation:bgSpin 7s linear infinite}
.bg-flow{stroke-dasharray:18 12;animation:bgFlow 2.4s linear infinite}
.bg-flow-s{stroke-dasharray:6 14;animation:bgFlow 1.6s linear infinite reverse}
@keyframes bgFlow{to{stroke-dashoffset:-60}}
.bg-pulse{transform-box:fill-box;transform-origin:center;animation:bgPulse 2.2s ease-in-out infinite}
@keyframes bgPulse{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.25)}}
.bg-scan{position:absolute;left:0;right:0;top:-120px;height:120px;background:linear-gradient(180deg,rgba(110,255,160,0) 0%,rgba(110,255,160,0.10) 70%,rgba(170,255,200,0.28) 100%);animation:bgScan 5.5s linear infinite}
@keyframes bgScan{to{transform:translateY(860px)}}
.bg-mote{position:absolute;width:3px;height:3px;background:#9CFFB0;box-shadow:0 0 6px #6CFF9A;animation:bgMote 9s linear infinite;opacity:0}
@keyframes bgMote{0%{opacity:0;transform:translateY(0)}15%{opacity:.9}85%{opacity:.6}100%{opacity:0;transform:translateY(-320px)}}
.bg-blink{animation:bgBlink 1.2s steps(2) infinite}
@keyframes bgBlink{50%{opacity:.2}}
@media (prefers-reduced-motion: reduce){.bg-grid,.bg-spin,.bg-spin-r,.bg-sweep,.bg-flow,.bg-flow-s,.bg-pulse,.bg-scan,.bg-mote,.bg-blink{animation:none}}
.mb{position:relative;display:flex;align-items:center;gap:12px;width:300px;height:50px;padding:0 14px 0 0;border:0;overflow:hidden;background:linear-gradient(90deg,rgba(3,22,10,0.9) 0%,rgba(6,40,18,0.66) 100%);box-shadow:inset 0 0 0 1px rgba(124,255,142,0.32);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));cursor:pointer;color:#E8FFEE;text-align:left;transition:transform .15s ease,background .15s ease}
.mb:hover{transform:translateX(6px);background:linear-gradient(90deg,rgba(10,60,26,0.95) 0%,rgba(14,80,34,0.7) 100%);box-shadow:inset 0 0 0 1px rgba(156,255,176,0.7)}
.mb-num{flex:none;width:50px;height:100%;display:flex;align-items:center;justify-content:center;background:rgba(70,232,107,0.13);border-right:1px solid rgba(124,255,142,0.3);font-family:'Share Tech Mono',monospace;font-size:20px;color:#7CFF8E}
.mb-txt{display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0;flex:1}
.mb-t{font-family:'Saira Condensed',sans-serif;font-size:22px;font-weight:700;letter-spacing:.5px;line-height:1;text-transform:uppercase;color:#FFFFFF;white-space:nowrap}
.mb-m{font-family:'Share Tech Mono',monospace;font-size:12px;line-height:1;color:#A8D9B4;white-space:nowrap}
.mb-tag{flex:none;font-family:'Saira Condensed',sans-serif;font-size:12px;font-weight:800;letter-spacing:1px;padding:2px 6px;background:#F2C14A;color:#1A1405}
.mb-on{transform:translateX(16px);background:linear-gradient(90deg,#9CFFB0 0%,#46E86B 55%,#2AB84F 100%);box-shadow:0 0 24px rgba(70,232,107,0.55)}
.mb-on:hover{transform:translateX(16px);background:linear-gradient(90deg,#B4FFC4 0%,#5AF07C 55%,#33C653 100%)}
.mb-on .mb-num{background:#03140A;color:#9CFFB0;border-right:0}
.mb-on .mb-t{color:#03140A}
.mb-on .mb-m{color:#0B3A1A}
.mb-on::after{content:"";position:absolute;top:0;bottom:0;left:-90px;width:70px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,0.5),rgba(255,255,255,0));animation:mbGlint 3s ease-in-out infinite}
@keyframes mbGlint{0%{left:-90px}55%,100%{left:110%}}
.mb-ptr{position:absolute;width:12px;height:18px;background:#9CFFB0;clip-path:polygon(0 0,100% 50%,0 100%);animation:mbPtr 1s ease-in-out infinite}
@keyframes mbPtr{50%{transform:translateX(4px);opacity:.6}}
.mb-dim{opacity:.75}
@media (prefers-reduced-motion: reduce){.mb-on::after,.mb-ptr{animation:none}}
</style>
